# Application Settings
spring.application.name=smart-bike-rental
server.port=8080

# Database Configuration (MySQL default with H2 fallback capability)
spring.datasource.url=jdbc:mysql://localhost:3306/bikerental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Storage Configuration
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Thymeleaf Cache (disable for active development)
spring.thymeleaf.cache=false

# Security Logging
logging.level.org.springframework.security=INFO
logging.level.com.bikerental=DEBUG
