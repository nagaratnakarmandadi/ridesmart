<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>RideSmart | Reset Password</title>
</head>
<body>
<div th:fragment="content">

    <div class="container py-5 max-w-md">
        <div class="card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="badge bg-indigo-subtle text-indigo px-3 py-1 rounded-pill fw-bold mb-2 small">
                    <i class="bi bi-key-fill me-1"></i> ACCOUNT RECOVERY
                </span>
                <h3 class="fw-bold text-navy mb-1 fs-2">Reset Your Password</h3>
                <p class="text-muted small">Enter your registered email address and we'll help you regain access to your account.</p>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-dark">Email Address *</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-indigo border"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control form-control-custom" placeholder="name@example.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-indigo w-100 py-3 fw-bold fs-6 mb-3">
                    <i class="bi bi-send-fill me-2"></i> Send Reset Link
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}" class="text-indigo text-decoration-none fw-bold small">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
