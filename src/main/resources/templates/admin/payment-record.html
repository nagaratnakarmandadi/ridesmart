<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>Record Payment - RideSmart</title>
</head>
<body>
<div th:fragment="content">

    <div class="container py-5 max-w-2xl">
        <div class="card-custom p-4 mb-4">
            <h4 class="fw-bold mb-1"><i class="bi bi-credit-card text-indigo me-2"></i> Record Customer Payment</h4>
            <p class="text-muted small mb-0">Record Cash or UPI payment collection and generate final paid tax invoice.</p>
        </div>

        <div class="card-custom p-4">
            <form th:action="@{/admin/rentals/payment/record}" method="post">
                <input type="hidden" name="rentalId" th:value="${rental.id}">

                <div class="p-3 bg-light rounded-3 mb-4 border d-flex align-items-center justify-content-between">
                    <div>
                        <span class="text-muted small">Total Invoice Bill Settlement</span>
                        <div class="fw-bold text-indigo fs-3">₹<span th:text="${#numbers.formatDecimal(rental.totalFinalAmount, 1, 'COMMA', 2, 'POINT')}">500.00</span></div>
                    </div>
                    <div class="text-end">
                        <span class="text-muted small">Rental Ref</span>
                        <div class="fw-bold font-monospace" th:text="${rental.rentalNumber}">RNT-12345</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Amount Collected (₹)</label>
                    <input type="number" step="0.01" class="form-control form-control-custom fw-bold fs-5" name="amount" th:value="${rental.totalFinalAmount}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Payment Method</label>
                    <select class="form-select form-control-custom" name="paymentMethod" required>
                        <option value="UPI" selected>UPI (Google Pay, PhonePe, Paytm)</option>
                        <option value="CASH">Cash Collection</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">UPI Transaction Ref / Bank UTR Number</label>
                    <input type="text" class="form-control form-control-custom font-monospace" name="transactionRefNumber" placeholder="e.g. UTR-424019283741">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted">Notes / Memo</label>
                    <input type="text" class="form-control form-control-custom" name="notes" placeholder="Payment notes...">
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/admin/dashboard}" class="btn btn-outline-custom">Cancel</a>
                    <button type="submit" class="btn btn-success px-4 py-2 fw-bold fs-6">
                        <i class="bi bi-check-circle-fill me-1"></i> Confirm & Save Paid Payment
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
