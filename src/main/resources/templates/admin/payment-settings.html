<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div.content-wrapper})}">
<head>
    <title>Payment Settings - RideSmart Owner Portal</title>
</head>
<body>
<div class="content-wrapper">
    <div class="page-hero-light text-center py-4 mb-4" style="background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);">
        <div class="container">
            <h1 class="display-6 fw-bold text-white mb-2"><i class="bi bi-qr-code text-warning me-2"></i> Owner Payment & QR Settings</h1>
            <p class="text-white-50 mb-0">Configure business UPI ID, account details, and upload RideSmart QR scanner code</p>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-white py-3 border-bottom border-light">
                        <h5 class="fw-bold text-navy mb-0"><i class="bi bi-gear-fill me-2 text-indigo"></i> Business Payment Configuration</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/payments/settings}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="businessName" class="form-label fw-semibold text-navy">Business / Account Name *</label>
                                <input type="text" class="form-control" id="businessName" name="businessName" th:value="${settings.businessName}" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="upiId" class="form-label fw-semibold text-navy">Business UPI ID *</label>
                                    <input type="text" class="form-control" id="upiId" name="upiId" th:value="${settings.upiId}" placeholder="e.g. ridesmart@upi" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="upiNumber" class="form-label fw-semibold text-navy">UPI Mobile Number *</label>
                                    <input type="text" class="form-control" id="upiNumber" name="upiNumber" th:value="${settings.upiNumber}" placeholder="e.g. 9876543210" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="qrFile" class="form-label fw-semibold text-navy">Upload / Replace Payment QR Code Image</label>
                                <input type="file" class="form-control" id="qrFile" name="qrFile" accept="image/*">
                                <div class="form-text">Upload a clear JPG/PNG image of your GPay/PhonePe/Paytm QR code.</div>
                            </div>

                            <div class="p-3 bg-light rounded-3 mb-4 text-center">
                                <h6 class="fw-bold text-muted small mb-2">CURRENT PAYMENT QR CODE PREVIEW</h6>
                                <img th:src="${settings.qrCodeUrl}" alt="Current QR Code" class="img-fluid rounded-3 border shadow-sm p-2" style="max-width: 200px;">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold py-3">
                                    <i class="bi bi-save-fill me-2"></i> Save Payment Settings
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
