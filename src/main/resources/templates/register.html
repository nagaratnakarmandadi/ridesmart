<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>RideSmart | Create Account</title>
</head>
<body>
<div th:fragment="content">

    <div class="container py-5 max-w-2xl">
        <div class="card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="badge bg-indigo-subtle text-indigo px-3 py-1 rounded-pill fw-bold mb-2 small">
                    <i class="bi bi-person-plus-fill me-1"></i> CUSTOMER REGISTRATION
                </span>
                <h3 class="fw-bold text-navy mb-1 fs-2">Create Your RideSmart Account</h3>
                <p class="text-muted small">Register to browse, book, and manage your bike rentals.</p>
            </div>

            <form th:action="@{/register}" th:object="${registrationForm}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">Full Name *</label>
                        <input type="text" th:field="*{fullName}" class="form-control form-control-custom" placeholder="e.g. Rahul Sharma" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">Mobile Number *</label>
                        <input type="tel" th:field="*{mobileNumber}" class="form-control form-control-custom" placeholder="10-digit mobile" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">Email Address *</label>
                        <input type="email" th:field="*{email}" class="form-control form-control-custom" placeholder="name@example.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">Password *</label>
                        <input type="password" th:field="*{password}" class="form-control form-control-custom" placeholder="Minimum 6 chars" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">Date of Birth *</label>
                        <input type="date" th:field="*{dateOfBirth}" class="form-control form-control-custom" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">Emergency Contact Number *</label>
                        <input type="tel" th:field="*{emergencyContact}" class="form-control form-control-custom" placeholder="Emergency relative contact" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-semibold text-dark">Residential Address *</label>
                        <input type="text" th:field="*{address}" class="form-control form-control-custom" placeholder="Street address, Apartment/House No" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">City *</label>
                        <input type="text" th:field="*{city}" class="form-control form-control-custom" placeholder="City" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">State *</label>
                        <input type="text" th:field="*{state}" class="form-control form-control-custom" placeholder="State" required>
                    </div>
                    
                    <div class="col-12 mt-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label small text-muted" for="termsCheck">
                                I agree to the <a th:href="@{/terms}" target="_blank" class="text-indigo text-decoration-none fw-semibold">RideSmart Terms & Conditions</a> and <a th:href="@{/privacy}" target="_blank" class="text-indigo text-decoration-none fw-semibold">Privacy Policy</a>.
                            </label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-indigo w-100 py-3 fw-bold fs-6 mt-4 mb-3">
                    <i class="bi bi-person-check-fill me-2"></i> Create Account
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted small">Already have an account? </span>
                <a th:href="@{/login}" class="text-indigo text-decoration-none fw-bold">Log In</a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
